spring.application.name=concretolab-desktop
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite en la carpeta del usuario
spring.datasource.url=jdbc:sqlite:${user.home}/.concretolab/concretolab.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.root=WARN
logging.level.com.concretolab=INFO

# Datos de demostracion: crea el proyecto "DEMO - Edificacion de practica" con materiales, tamizado, mezcla, ensayo y cercha.
# Esta APAGADO por defecto para no tocar datos reales. Ponlo en true (o usa -Dapp.seeder.enabled=true) para cargarlos;
# es idempotente (no duplica), pero si borras el proyecto DEMO volvera a crearse mientras siga en true.
app.seeder.enabled=true
