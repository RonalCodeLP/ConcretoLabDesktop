spring.application.name=concretolab-desktop
# Versión: la sustituye Maven al construir (resource filtering de spring-boot-starter-parent)
app.version=@project.version@
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite en la carpeta del usuario
spring.datasource.url=jdbc:sqlite:${concretolab.datos:${user.home}/.concretolab}/concretolab.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.root=WARN
logging.level.com.concretolab=INFO

# Datos de demostracion: crea el proyecto "DEMO - Edificacion de practica" con materiales, tamizado, mezcla y ensayo.
# Esta APAGADO por defecto para no tocar datos reales. Ponlo en true (o usa -Dapp.seeder.enabled=true) para cargarlos;
# es idempotente (no duplica), pero si borras el proyecto DEMO volvera a crearse mientras siga en true.
app.seeder.enabled=false

# Registro de actividad en archivo (la app instalada no tiene consola). Rota a los 5 MB y conserva 7 dias.
logging.file.name=${concretolab.datos:${user.home}/.concretolab}/logs/concretolab.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB

# Migraciones de esquema (Flyway). Una base creada antes se toma como punto de partida (baseline 0) y se completa con V1 y V2.
# El esquema ya no se modifica solo (ddl-auto=none): cada cambio de las entidades necesita una migracion nueva en db/migration.
# No se usa ddl-auto=validate porque Hibernate espera bigint en los ids y SQLite necesita integer para autoincrementarlos;
# EsquemaMigracionesTest comprueba que cada entidad coincide con las tablas migradas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
