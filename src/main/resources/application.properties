spring.application.name=concretolab-desktop
app.version=@project.version@
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.datasource.url=jdbc:sqlite:${concretolab.datos:${user.home}/.concretolab}/concretolab.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.root=WARN
logging.level.com.concretolab=INFO

app.seeder.enabled=false

logging.file.name=${concretolab.datos:${user.home}/.concretolab}/logs/concretolab.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
